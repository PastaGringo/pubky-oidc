# Local Tuwunel for testing: sign-in only through Pubky Ring (this OIDC provider).
# No federation, no password registration.

[global]
server_name = "localhost"
database_path = "/var/lib/tuwunel"
address = ["0.0.0.0"]
port = 8008
allow_federation = false
allow_registration = false
# The display name comes from the Pubky profile: no decorative suffix.
new_user_displayname_suffix = ""

[global.well_known]
client = "http://localhost:8008"

[[global.identity_provider]]
brand = "Pubky"
name = "Pubky Ring"
client_id = "pubky-ring"
client_secret_file = "/run/secrets/pubky_client_secret"
# The issuer must be the same from inside the container AND from the browser.
issuer_url = "http://host.docker.internal:4000"
callback_url = "http://localhost:8008/_matrix/client/unstable/login/sso/callback/pubky-ring"
scope = ["openid", "profile"]
# The Pubky key (`sub` claim) becomes the Matrix localpart, with no random fallback.
userid_claims = ["sub"]
unique_id_fallbacks = false
